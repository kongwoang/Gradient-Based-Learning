<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f5f2">
  <meta name="description" content="Papers, research notes, and reproductions.">
  <title>Gradient — Paper Library</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/styles.css?v=5">
  <script type="module" src="./assets/app.js?v=5"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to papers</a>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Gradient home"><span class="brand-mark">∇</span>Gradient</a>
    <button id="account-button" class="account-button"><span data-icon="cloud"></span><span id="account-label">Sign in to sync</span></button>
  </header>
  <main id="main" class="main-content">
    <section class="page-heading"><div><h1 id="page-title">Paper library</h1><p>Papers, notes, and reproductions.</p></div><button class="button primary" id="new-paper"><span data-icon="plus"></span>Add paper</button></section>
    <nav id="topic-nav" class="topic-nav" aria-label="Paper topics"></nav>
        <section class="library-panel" aria-label="Papers">
          <div class="view-row"><div class="view-tabs" role="tablist" aria-label="Table view"><button id="view-library" class="view-tab active" role="tab" aria-selected="true" data-view="library"><span data-icon="list"></span>Library</button><button id="view-research" class="view-tab" role="tab" aria-selected="false" data-view="research"><span data-icon="table"></span>Notes</button></div></div>
          <div class="toolbar"><label class="search-box"><span data-icon="search"></span><input id="search" type="search" placeholder="Search papers or notes…" aria-label="Search papers"><kbd>/</kbd></label><div class="filters"><label class="select-control"><span data-icon="filter"></span><select id="status-filter" aria-label="Filter by status"><option value="All">All statuses</option><option>To read</option><option>Reading</option><option>Read</option><option>Reproducing</option><option>Reproduced</option></select></label><label class="select-control"><span data-icon="sort"></span><select id="sort-order" aria-label="Sort papers"><option value="default">Default order</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="name">Name A–Z</option><option value="updated">Recently edited</option></select></label><div class="more-container"><button class="icon-button" id="more-button" aria-label="Backup and export" aria-expanded="false"><span data-icon="more"></span></button><div class="dropdown" id="more-menu" hidden><button id="export-json"><span data-icon="download"></span>Export backup<span>JSON</span></button><button id="export-markdown"><span data-icon="file"></span>Export notes<span>MD</span></button><div class="menu-rule"></div><button id="import-json"><span data-icon="upload"></span>Import backup</button></div></div></div></div>
          <div id="notice" class="notice" hidden role="status"></div>
          <div class="table-scroll" id="table-scroll" tabindex="0" aria-label="Paper table. Scroll horizontally for more columns."><table id="paper-table"><thead id="table-head"></thead><tbody id="table-body"></tbody></table><div class="empty-state" id="empty-state" hidden><span data-icon="search"></span><h2>No papers found</h2><p>Try another search or clear your filters.</p><button class="button secondary" id="clear-filters">Clear filters</button></div><div id="loading" class="loading-state"><span class="spinner"></span>Opening your library…</div></div>
          <footer class="table-footer"><span id="results-count">19 papers</span><span id="save-state" role="status"><span class="tiny-dot"></span>Opening your library…</span></footer>
        </section>
    <footer class="page-footer"><a href="https://github.com/kongwoang/Gradient-Based-Learning" target="_blank" rel="noopener noreferrer">Library on GitHub <span data-icon="external"></span></a></footer>
  </main>
  <dialog id="paper-dialog" class="drawer" aria-labelledby="drawer-title"></dialog>
  <dialog id="cell-dialog" class="modal cell-modal" aria-labelledby="cell-title"></dialog>
  <dialog id="account-dialog" class="modal account-modal" aria-labelledby="account-title"></dialog>
  <dialog id="confirm-dialog" class="modal confirm-modal" aria-labelledby="confirm-title"></dialog>
  <input id="import-file" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><div class="no-script">Please enable JavaScript to use the paper library. You can also read the <a href="https://github.com/kongwoang/Gradient-Based-Learning">papers on GitHub</a>.</div></noscript>
</body>
</html>
